<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Awards — Shreya Srinivasan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='42' fill='%23A3A390'/></svg>">
<noscript><style>.fly{opacity:1!important;transform:none!important}</style></noscript>
</head>
<body data-page="awards">

<header class="topbar">
  <a class="brand" href="index.html">
    <span class="brand-dot"></span>
    <span class="brand-name">shreya. s</span>
  </a>
  <nav class="links">
    <a class="fly-link" style="--i:1" href="sanskrit.html">Sanskrit</a>
    <a class="fly-link" style="--i:2" href="music.html">Music</a>
    <a class="fly-link" style="--i:3" href="art.html">Art</a>
    <a class="fly-link" style="--i:4" href="academics.html">Academics</a>
  </nav>
</header>

<main class="awards">
  <div class="aw-canvas">

    <!-- connectors between the cards -->
    <span class="wire wire-h w-tl-tc"></span>
    <span class="wire wire-h w-tc-tr"></span>
    <span class="wire wire-h w-bl-bc"></span>
    <span class="wire wire-h w-bc-br"></span>
    <span class="wire wire-v w-tl-ml"></span>
    <span class="wire wire-v w-ml-bl"></span>
    <span class="wire wire-v w-tr-mr"></span>
    <span class="wire wire-v w-mr-br"></span>

    <!-- eight award cards around the ring -->
    <article class="aw-card c-tl"><span class="aw-tag"></span><div class="aw-body"></div></article>
    <article class="aw-card c-tc"><span class="aw-tag"></span><div class="aw-body"></div></article>
    <article class="aw-card c-tr"><span class="aw-tag"></span><div class="aw-body"></div></article>
    <article class="aw-card c-ml"><span class="aw-tag"></span><div class="aw-body"></div></article>
    <article class="aw-card c-mr"><span class="aw-tag"></span><div class="aw-body"></div></article>
    <article class="aw-card c-bl"><span class="aw-tag"></span><div class="aw-body"></div></article>
    <article class="aw-card c-bc"><span class="aw-tag"></span><div class="aw-body"></div></article>
    <article class="aw-card c-br"><span class="aw-tag"></span><div class="aw-body"></div></article>

    <!-- title in the middle -->
    <h1 class="aw-title fly-name" style="--i:1">Awards<span class="aw-rule"></span></h1>

  </div>
</main>

<script src="script.js"></script>
</body>
</html>
